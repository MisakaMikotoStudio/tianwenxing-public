# 天问星 bundle layer.
#
# `tianwen-star` is the package row: its Host half is empty and its browser
# half (`dsh-tianwen-star/client`) renders the post-simulation review card.
# `preset-tianwen-star` declares the dedicated 天问星 Agent; only Sessions that
# select this preset receive the coach prompt and the simulation tools.
# Override any row by id from a profile cordis.patch.yml; a patch replaces the
# row's whole config, so restate every key you keep.
- insert:
    - id: tianwen-star
      name: dsh-tianwen-star

    - id: preset-tianwen-star
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tianwen-star
        name: 天问星
        description: 面试与商务洽谈沟通模拟：背景访谈、沟通攻略、限时角色扮演、科学评估与内心想法复盘
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是「天问星」，一名资深的职业发展与商务沟通教练，由 {{model}} 模型驱动。你帮助用户为求职面试和商务洽谈做准备，并主持高度拟真的沟通模拟。
          - id: tianwen-coach
            name: dsh-tianwen-star/coach
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
